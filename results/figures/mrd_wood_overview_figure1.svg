<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img">
  <title>Overview of MRD-Wood</title>
  <desc>Frozen representations under synthetic and real acquisition shifts are diagnosed through representation drift, exposing cross-source and cross-magnification boundaries and supporting a derived label-free mismatch alarm.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8f8f8f" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
      .title { fill: #ffffff; font-size: 27px; font-weight: 700; }
      .sub { fill: #d0d0d0; font-size: 18px; }
      .finding-sub { fill: #d6d0ff; font-size: 17px; }
      .arrow { fill: none; stroke: #8f8f8f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="850" fill="#ffffff"/>

  <rect x="90" y="35" width="430" height="105" rx="18" fill="#45453f"/>
  <text class="title" x="305" y="79">Frozen backbone</text>
  <text class="sub" x="305" y="113">pretrained, no fine-tuning</text>

  <rect x="680" y="35" width="430" height="105" rx="18" fill="#45453f"/>
  <text class="title" x="895" y="79">Acquisition shift</text>
  <text class="sub" x="895" y="113">synthetic and real: cross-source, scale</text>

  <path class="arrow" d="M305 140 L440 205"/>
  <path class="arrow" d="M895 140 L760 205"/>

  <rect x="255" y="205" width="690" height="105" rx="18" fill="#10664f"/>
  <text class="title" x="600" y="250">Representation drift</text>
  <text x="600" y="283" fill="#8ed1ba" font-size="19">quantifies the acquisition-shift gap</text>

  <path class="arrow" d="M600 310 L600 365"/>

  <rect x="230" y="365" width="740" height="110" rx="18" fill="#362a9e" stroke="#776bd2" stroke-width="3"/>
  <text class="title" x="600" y="412">The gap is partly in the model</text>
  <text class="finding-sub" x="600" y="449">source identity transfers across held-out species</text>

  <text x="600" y="510" fill="#666666" font-size="17" font-style="italic">two WoodID-specific boundaries</text>
  <path class="arrow" d="M600 475 L350 545"/>
  <path class="arrow" d="M600 475 L850 545"/>

  <rect x="55" y="545" width="520" height="140" rx="18" fill="#4033a9" stroke="#776bd2" stroke-width="3"/>
  <text class="title" x="315" y="596">Cross-source collapse</text>
  <text class="finding-sub" x="315" y="635">BFS46 &lt;-&gt; FSDM41:</text>
  <text class="finding-sub" x="315" y="661">within-source 0.98, cross-source 0.01</text>

  <rect x="625" y="545" width="520" height="140" rx="18" fill="#4033a9" stroke="#776bd2" stroke-width="3"/>
  <text class="title" x="885" y="591">Cross-magnification</text>
  <text class="title" x="885" y="623">asymmetry</text>
  <text class="finding-sub" x="885" y="661">x50: locus of cross-scale incompatibility</text>

  <path class="arrow" d="M315 685 L500 735"/>
  <path class="arrow" d="M885 685 L700 735"/>

  <rect x="365" y="735" width="470" height="80" rx="18" fill="#7065c8"/>
  <text class="title" x="600" y="771">Label-free mismatch alarm</text>
  <text x="600" y="799" fill="#e0ddff" font-size="17">flags shift, not accuracy-loss severity</text>
</svg>
